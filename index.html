<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一个短链</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            text-align: center;
            padding: 40px 20px;
        }
        h1 {
            font-size: 28px;
            font-weight: 400;
            color: #1a1a1a;
            letter-spacing: 0.5px;
        }
        .sub {
            margin-top: 16px;
            font-size: 14px;
            color: #999;
            font-weight: 300;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>私人短链。</h1>
        <p class="sub">— 安静 · 简洁 · 隐私 —</p>
    </div>
</body>
</html>
